  } else {
    html+=`<h3>開新房間（GM）</h3>
    <label class="fld"><span>房間名稱</span><input type="text" id="hTitle" maxlength="40" placeholder="例如：輪迴之境 第三章"></label>
    <label class="fld"><span>GM 密碼（至少 4 個字，進 GM 身分時要用）</span><input type="password" id="hPw" autocomplete="new-password"></label>
    <label class="fld"><span>初始地圖</span><select id="hMap">${MAP_PRESETS.map(p=>`<option value="${p.id}">${esc(p.name)}（${p.cols}×${p.rows}）</option>`).join("")}</select></label>
    <div class="row" style="justify-content:flex-end"><button class="btn gm" data-h="create">建立房間</button></div>
    <h3>加入房間</h3>
    <div class="row"><input type="text" id="hCode" maxlength="6" placeholder="房間代碼" style="flex:1;text-transform:uppercase" class="code" autocapitalize="characters"><button class="btn primary" data-h="join">加入</button></div>`;
    if (recent.length) html+=`<h3>最近的房間</h3><div class="list">`+recent.map(r=>`<div class="item"><span class="nm">${esc(r.title||r.code)}</span><span class="meta code">${esc(r.code)}</span><button class="btn" data-h="go" data-code="${esc(r.code)}">進入</button></div>`).join("")+`</div>`;
    html+=`<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-h="solo">單機模式</button></div>`;
  }
  html+=`<p class="err">${esc(msg||"")}</p></div>`;
  h.innerHTML=html; h.classList.add("open");
  h.onclick=async e=>{
    const b=e.target.closest("button[data-h]"); if(!b) return; const a=b.dataset.h;
    if (a==="setdb"){ const v=$("#hDb").value.trim().replace(/\/+$/,""); if(!/^https:\/\/.+/.test(v)){ renderHome("網址要以 https:// 開頭"); return; } lsSet("bm-dburl",v); DB_URL=v; location.href=roomUrl((qs.get("room")||"").toUpperCase()); }
    if (a==="solo") startLocal();
    if (a==="join"||a==="go"){ const c=(b.dataset.code||$("#hCode").value).trim().toUpperCase(); if(!/^[A-Z0-9]{4,8}$/.test(c)){ renderHome("房間代碼是 6 個英數字"); return; } location.href=roomUrl(c); }
    if (a==="create"){
      const title=$("#hTitle").value.trim().slice(0,40)||"戰術地圖", pw=$("#hPw").value;
      if (pw.length<4){ renderHome("GM 密碼至少 4 個字"); return; }
      b.disabled=true;
      try{
        let code=roomCode(); for (let i=0;i<4;i++){ const ex=await fb.ref(`rooms/${code}/meta`).once("value"); if(!ex.exists()) break; code=roomCode(); }
        const gmHash=await hashStr(`${code}:gm:${pw}`);
        const pr=MAP_PRESETS.find(x=>x.id===$("#hMap").value)||MAP_PRESETS[0], {cfg:pc,image}=presetCfg(pr,(Math.random()*1e9)|0);
        const room={meta:{title,gmHash,created:Date.now()}, cfg:{...DEFAULT_CFG,...pc,title}, tokens:defaultPCs(1)};
        if (image) room.images={[image.id]:{data:image.data, at:Date.now()}};
        if (pc.walls){ const ids=Object.keys(room.tokens), fl=[]; for (let i=0;i<pc.walls.length && fl.length<ids.length;i++) if (pc.walls[i]==="0"){ const x=i%pc.cols, y=Math.floor(i/pc.cols); if (!fl.some(([a,b])=>Math.abs(a-x)<2&&Math.abs(b-y)<1)) fl.push([x,y]); }
          ids.forEach((id,i)=>{ if (fl[i]){ room.tokens[id].x=fl[i][0]; room.tokens[id].y=fl[i][1]; } }); }
        await fb.ref(`rooms/${code}`).set(room);
        lsSet("bm-gm-"+code,gmHash); addRecent(code,title);
        location.href=roomUrl(code);
      }catch(err){ b.disabled=false; renderHome(/permission/i.test(String(err&&(err.code||err.message)))?"資料庫拒絕寫入：請照說明設定 Firebase 規則":"建立失敗，請檢查資料庫網址與網路"); }
    }
  };
}

/* ============ 啟動 ============ */
function subscribeRoom(){
  let pending=4; const done=()=>{ if(--pending<=0){ clearTimeout(timer); status(null); } };
  const timer=setTimeout(()=>status("連不上資料庫，畫面可能不是最新"),10000);
  status("載入中…");
  let f1=true, f2=true, f3=true, f4=true, bgUnsub=null, bgFor=null;
  listen(`${R}/cfg`, v=>{
    const c=v||{}; S.cfg={...DEFAULT_CFG,...c}; S.cfg.walls=c.walls||""; S.cfg.reveal=c.reveal||"";
    if (S.cfg.bgId!==bgFor){ bgFor=S.cfg.bgId; if(bgUnsub) bgUnsub(); bgUnsub=null; if (bgFor) bgUnsub=listen(`${R}/images/${bgFor}`, im=>setBgData(im&&im.data)); else setBgData(null); }
    visCache.key=null; applyTitle(); setRole();
    if (f1){ f1=false; fitView(); done(); }
    renderTools(); renderPanel(); draw();
  });
  listen(`${R}/tokens`, v=>{
    S.tokens=v||{}; if (S.sel && !S.tokens[S.sel]) S.sel=null;
    S.tokensReady=true; if (S.isGM) pruneCombat();
    const gmEl=$("#gMine"); if (gmEl) gmEl.textContent=gateMineText();
    visCache.key=null; renderPanel(); updateHud(); draw();
    if (f2){ f2=false; done(); }
  });
  listen(`${R}/patterns`, v=>{ S.patterns=v||{}; renderTools(); if (S.tab==="pats") renderPanel(); });
  listen(`${R}/templates`, v=>{ S.templates=v||{}; if (S.selTpl && !S.templates[S.selTpl]) S.selTpl=null; draw(); if (f3){ f3=false; done(); } });
  listen(`${R}/combat`, v=>{
    const order=normOrder(v&&v.order);
    S.combat={round:+(v&&v.round)||1, turn:clamp(+(v&&v.turn)||0,0,Math.max(0,order.length-1)), order};
    if (S.tokensReady && S.isGM) pruneCombat();
    updateHud(); renderPanel(); draw(); if (f4){ f4=false; done(); }
  });
  listen(`${R}/music`, v=>{ M.state = v && v.kind && v.src ? v : null; applyMusic(); if (S.tab==="music") renderPanel(); });
  listen(`${R}/playlist`, v=>{ M.playlist=v||{}; if (S.tab==="music") renderPanel(); });
  if (S.online){
    fb.ref(".info/serverTimeOffset").on("value", s=>{ M.off=+s.val()||0; });
    let peerKey="";
    listen(`${R}/presence`, v=>{ S.peers=v||{}; draw(); const k=Object.entries(S.peers).map(([id,p])=>id+":"+(p&&p.name)).sort().join("|"); if (k!==peerKey){ peerKey=k; renderPanel(); } });
    fb.ref(".info/connected").on("value", s=>{ if (s.val()===false && !f1) status("連線中斷，重新連線中…"); else if (s.val()) { status(null); if (!$("#gate").classList.contains("open")){ const pr=ref(`${R}/presence/${S.me}`); pr.update({name:S.myName||"?",role:S.isGM?"gm":"player",at:Date.now()}).catch(()=>{}); pr.onDisconnect().remove(); } } });
  }
}
function status(msg){ const s=$("#status"); if(!msg){ s.hidden=true; return; } s.hidden=false; s.textContent=msg; }
function startLocal(){
  $("#home").classList.remove("open");
  fb=null; S.online=false; S.isGM=true; S.room="LOCAL"; R="rooms/LOCAL";
  subscribeRoom(); startSaves(); setRole(); renderAll(); renderMusic();
  setTimeout(()=>{ if (!Object.keys(S.tokens).length){
    for (const [id,t] of Object.entries(defaultPCs(1))) putToken(id,t);
    putToken("demo2",{name:"巨魔",size:"large",color:PALETTE[6],vision:16,claimable:false,hidden:false,x:5,y:10,at:2});
  } }, 300);
}
async function boot(){
  new ResizeObserver(resize).observe($("#stage"));
  renderTools(); setRole(); applyTitle();
  requestAnimationFrame(()=>{ resize(); fitView(); });
  fb = initFirebase(DB_URL);
  if (fb && !FIREBASE_DB_URL) lsSet("bm-dburl", DB_URL);
  const code=(qs.get("room")||"").toUpperCase();
  if (!fb || !code){ renderHome(); return; }
  S.room=code; R=`rooms/${code}`; S.online=true;
  status("連線中…");
  let meta=null;
  try{ meta=(await Promise.race([fb.ref(`${R}/meta`).once("value"), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),12000))])).val(); }
  catch(e){ status(null); renderHome(/permission/i.test(String(e&&(e.code||e.message)))?"資料庫拒絕讀取：請照說明設定 Firebase 規則":"連不上資料庫，請檢查網路或資料庫網址"); return; }
  status(null);
  if (!meta){ dropRecent(code); renderHome(`找不到房間 ${code}，可能已被刪除`); return; }
  S.meta=meta; S.cfg.title=meta.title||S.cfg.title; applyTitle(); addRecent(code, meta.title);
  listen(`${R}/meta`, v=>{ if (v) { S.meta=v; return; } if (S.deleting) return; dropRecent(code); stopMusic(); $("#gate").classList.remove("open"); renderHome(`房間 ${code} 已被 GM 刪除`); });
  subscribeRoom();
  openGate();
}
boot();
})();
</script>
