<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24322f">
<title>戰術地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --ink:#1c2729; --ink-2:#4b5b5e; --paper:#e7e9e1; --panel:#f4f5f0; --line:#c7ccc0;
  --table:#24322f; --brass:#a87d12; --brass-ink:#fff8e2; --player:#2f7f86; --danger:#b23a3a;
  --chip:#dfe3d8; --shadow:0 6px 24px rgba(20,30,30,.18);
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e4e8df; --ink-2:#a3aea8; --paper:#151d1c; --panel:#1d2726; --line:#334240;
  --table:#101716; --brass:#d8ad3c; --brass-ink:#1a1405; --player:#6cc3c9; --danger:#e07070;
  --chip:#26322f; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#e4e8df; --ink-2:#a3aea8; --paper:#151d1c; --panel:#1d2726; --line:#334240;
  --table:#101716; --brass:#d8ad3c; --brass-ink:#1a1405; --player:#6cc3c9; --danger:#e07070;
  --chip:#26322f; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font:15px/1.5 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.num{font-family:"Chakra Petch","Noto Sans TC",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.role{font-size:12px;padding:2px 8px;border-radius:3px;font-weight:700;white-space:nowrap}
.role.gm{background:var(--brass);color:var(--brass-ink)}
.role.pl{background:var(--player);color:var(--paper)}
.role.solo{background:var(--chip);color:var(--ink-2)}
header .sp{flex:1}
.hbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 9px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.hbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#stage{position:relative;flex:1;min-height:0;background:var(--table);touch-action:none;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:10px;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tag{background:rgba(12,18,17,.8);color:#eef2ea;padding:4px 9px;border-radius:4px;font-size:13px}
#status{position:absolute;left:50%;transform:translateX(-50%);top:10px;font-size:12px;z-index:7;white-space:nowrap}
#music{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:calc(100% - 20px)}
#music[hidden]{display:none}
#muFab{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;box-shadow:var(--shadow);position:relative}
#muFab.on::after{content:"";position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:#5bd16a;box-shadow:0 0 0 2px var(--panel)}
#muCard{width:280px;max-width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
#music.min #muCard{position:absolute;right:0;top:0;width:220px;height:124px;overflow:hidden;opacity:0;pointer-events:none;z-index:-1}
.mu-top{display:flex;align-items:center;gap:6px;min-width:0}
#muTitle{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-kind{font-size:11px;padding:1px 6px;border-radius:3px;background:var(--chip);color:var(--ink-2);white-space:nowrap}
#muEmbed{border-radius:8px;overflow:hidden;background:#000}
#muEmbed:empty{display:none}
#muEmbed.vid{aspect-ratio:16/9}
#muEmbed.sp{height:152px;background:none}
#muEmbed iframe,#muEmbed>div{width:100%;height:100%;border:0;display:block}
#muEmbed .ph{display:flex;align-items:center;justify-content:center;color:#cfd6cc;font-size:13px;height:100%}
#muCtl{display:flex;flex-direction:column;gap:6px}
#muCtl .row{margin:0;flex-wrap:nowrap}
#muCtl .btn{padding:6px 10px;min-width:40px}
#muCtl input[type=range]{flex:1;min-width:0;accent-color:var(--brass)}
#muTime{font-size:12px;color:var(--ink-2);white-space:nowrap}
.mu-unlock{background:var(--brass);color:var(--brass-ink);border:0;border-radius:8px;padding:9px;font:inherit;font-weight:700;cursor:pointer}
.sheet-body input[type=range]{flex:1;accent-color:var(--brass)}
#tools{display:flex;gap:4px;padding:6px 8px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;z-index:5}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:54px;padding:5px 6px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool.gmonly{color:var(--brass)}
.tool.gmonly[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink)}
.tool .sub{font-size:10px;opacity:.75}
.divider{width:1px;background:var(--line);margin:4px 2px;flex:0 0 1px}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:52%;background:var(--panel);border-top:1px solid var(--line);box-shadow:var(--shadow);z-index:8;display:none;flex-direction:column;border-radius:12px 12px 0 0}
#sheet.open{display:flex}
@media (min-width:820px){#sheet{left:auto;top:0;bottom:0;width:340px;max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line)}}
.sheet-head{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center;overflow-x:auto}
.tab{border:0;background:none;font:inherit;font-size:14px;padding:6px 10px;border-radius:6px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--chip);color:var(--ink);font-weight:700}
.close{margin-left:auto;border:0;background:none;color:var(--ink-2);font-size:22px;line-height:1;cursor:pointer;padding:2px 8px}
.sheet-body{overflow:auto;padding:12px 14px 18px}
.sheet-body h3{font-size:14px;margin:14px 0 6px;color:var(--ink-2);font-weight:500}
.sheet-body h3:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row label{font-size:13px;color:var(--ink-2);min-width:64px}
input[type=text],input[type=number],input[type=password],input[type=url],select{font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);min-width:0}
input[type=number]{width:84px}
.row input[type=text]{flex:1}
input[type=color]{width:40px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.btn{font:inherit;font-size:14px;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gm{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin:6px 0}
.switch input{width:18px;height:18px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.item .dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;border:1px solid rgba(0,0,0,.25)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);margin:4px 0}
.empty{font-size:14px;color:var(--ink-2);padding:10px 0}
#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:14px;z-index:40;display:none;max-width:90%}
#toast button{margin-left:10px;background:none;border:1px solid currentColor;color:inherit;border-radius:5px;padding:3px 10px;font:inherit;cursor:pointer}
.overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(8,12,12,.62)}
.overlay.open{display:flex}
#home{background:var(--table)}
#modal{z-index:35}
.crop-card{max-width:560px}
.pat-card{max-width:480px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin:6px 0}
.preset{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer;text-align:center}
.preset:hover{border-color:var(--brass)}
.preset img,.preset-blank{max-width:100%;max-height:92px;border-radius:4px;display:block}
.preset-blank{height:92px;background:repeating-linear-gradient(0deg,#2b3a37 0 7px,#3b4c48 7px 8px),#2b3a37;background-blend-mode:normal}
.preset b{font-size:13px}.preset span{font-size:11px;color:var(--ink-2);line-height:1.3}
.fx-row{gap:6px}
.btn.fx{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;font-size:13px;position:relative}
.btn.fx.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.fxdot{width:14px;height:14px;border-radius:3px;display:inline-block;flex:0 0 auto}
.pat-grid{display:grid;gap:1px;background:#3a4644;border:1px solid #3a4644;border-radius:6px;overflow:hidden;touch-action:none;user-select:none;margin:8px auto;width:100%;max-width:min(100%,58vh)}
.pat-grid div{aspect-ratio:1;background:#25302e;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer}
.pat-grid div.on{background:var(--fx,#d9483b)}
.pat-grid div.me{background:#3f8f96;cursor:default}
.pat-grid div.ax{background:#2c3836}
.pat-grid div.ax.on{background:var(--fx,#d9483b)}
.pat-mini{display:inline-grid;gap:0;flex:0 0 auto;border:1px solid var(--line);background:#25302e}
.pat-mini i{display:block;width:4px;height:4px}
.pat-mini i.on{background:var(--fx,#d9483b)}.pat-mini i.me{background:#3f8f96}
.crop-wrap{display:flex;justify-content:center;background:#111;border-radius:8px;padding:6px;margin:8px 0;touch-action:none}
#cropCv{display:block;touch-action:none;cursor:move}
.tokthumb{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex:0 0 auto}
.gate-card{background:var(--panel);color:var(--ink);border-radius:14px;padding:20px;max-width:400px;width:100%;box-shadow:var(--shadow);max-height:100%;overflow:auto}
.gate-card h2{margin:0 0 4px;font-size:20px}
.gate-card h3{font-size:15px;margin:18px 0 4px}
.fld{display:block;margin:10px 0}
.fld span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:3px}
.fld input{width:100%}
.choice{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0 0;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.choice b{display:block;font-size:17px;margin-bottom:2px}
.choice span{font-size:13px;color:var(--ink-2)}
.choice.pl{border-color:var(--player)}
.choice.gm{border-color:var(--brass)}
.err{color:var(--danger);font-size:13px;margin:6px 0 0}
.code{font-family:"Chakra Petch",ui-monospace,monospace;letter-spacing:.12em;font-weight:600}
#selbar{position:absolute;left:10px;bottom:10px;display:none;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;box-shadow:var(--shadow);z-index:6;max-width:calc(100% - 76px)}
#selbar.open{display:flex}
#selbar .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#selbar .hint{margin:0;white-space:nowrap}
#selbar .btn{padding:8px 12px}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">戰術地圖</h1>
    <span id="role" class="role solo">單機</span>
    <span class="sp"></span>
    <button class="hbtn" id="btnPreview" aria-pressed="false" hidden>玩家視角</button>
    <button class="hbtn" id="btnInvite" hidden>邀請</button>
    <button class="hbtn" id="btnRole" hidden>身分</button>
    <button class="hbtn" id="btnPanel">面板</button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="status" class="tag" hidden></div>
    <div id="music" hidden><button id="muFab" aria-label="音樂播放器">♪</button><div id="muCard" role="region" aria-label="音樂播放器"><div class="mu-top"><span id="muTitle"></span><span class="mu-kind" id="muKind"></span><button class="btn" id="muMin" aria-label="收起播放器" style="padding:2px 9px">–</button></div><div id="muEmbed"></div><div id="muCtl"></div></div></div>
    <div id="selbar" role="toolbar" aria-label="選取的棋子"></div>
    <div id="zoom"><button data-z="1.25" aria-label="放大">+</button><button data-z="0.8" aria-label="縮小">−</button></div>
  </div>
  <nav id="tools" aria-label="工具"></nav>
  <section id="sheet" aria-label="面板">
    <div class="sheet-head" role="tablist" id="tabs"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div id="toast" role="status"></div>
  <div id="home" class="overlay" role="dialog" aria-label="房間"></div>
  <div id="gate" class="overlay" role="dialog" aria-modal="true" aria-label="選擇身分"></div>
  <div id="modal" class="overlay" role="dialog" aria-modal="true"></div>
</div>

<script>
/* =====================================================================
   設定：把你的 Firebase Realtime Database 網址填在這裡（只要填一次）
   例：https://my-trpg-default-rtdb.asia-southeast1.firebasedatabase.app
   留空也可以：第一次打開時頁面會請 GM 貼上，並自動帶進邀請連結。
   ===================================================================== */
const FIREBASE_DB_URL = "";

(() => {
"use strict";
/* ============ 常數 ============ */
const SIZES = [
  {k:"tiny",   n:"微型",   f:0.5},
  {k:"small",  n:"小型",   f:1},
  {k:"medium", n:"中型",   f:1},
  {k:"large",  n:"大型",   f:2},
  {k:"huge",   n:"超大型", f:3},
  {k:"garg",   n:"巨型",   f:4},
  {k:"colos",  n:"超巨型", f:6},
];
const FOOT = Object.fromEntries(SIZES.map(s => [s.k, s.f]));
const PALETTE = ["#3f8f96","#c2563f","#7a63b8","#4f9a4a","#c49a2c","#b84f86","#4a6fb0","#8a8f86"];
const MAX_GRID = 120;
function defaultPCs(startN){ const o={}; for (let i=0;i<5;i++) o["pc"+uid()]={name:`角色${startN+i}`,size:"medium",color:PALETTE[i],vision:20,claimable:true,hidden:false,x:2+i*2,y:2,at:Date.now()+i,createdBy:"gm"}; return o; }
const DEFAULT_CFG = {cols:12, rows:40, meters:2, fog:false, shareVision:true, walls:"", reveal:"", bgId:null, title:"戰術地圖"};

/* ============ 小工具 ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch {} };
function toast(msg, act){ const t=$("#toast"); t.textContent=msg;
  if (act){ const b=document.createElement("button"); b.textContent=act.label; b.onclick=()=>{ t.style.display="none"; act.fn(); }; t.appendChild(b); }
  t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none", act?7000:2600); }
async function hashStr(s){
  try { if (crypto && crypto.subtle){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); } } catch {}
  let h1=0x811c9dc5, h2=0x1505; for (let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=(Math.imul(h2,33)+c)>>>0; } return "f"+h1.toString(16)+h2.toString(16);
}
function roomCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<6;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
function bitGet(str, i){ return str.charCodeAt(i) === 49; }
function ensureBits(str){ const n=S.cfg.cols*S.cfg.rows; if(!str || str.length!==n) return "0".repeat(n); return str; }
function gridDist(dx, dy){ // 直線每格；第一次斜走 1 格，之後斜走 2 格
  dx=Math.abs(dx); dy=Math.abs(dy);
  const d=Math.min(dx,dy), st=Math.max(dx,dy)-d;
  return (st + (d>0 ? 1 + (d-1)*2 : 0)) * S.cfg.meters;
}
const fmtM = m => (Math.round(m*10)/10) + " 米";

/* ============ 對話框 ============ */
function dialog({title, text, fields=[], ok="確定", cancel="取消", danger=false}){
  return new Promise(res=>{
    const m=$("#modal");
    m.innerHTML=`<div class="gate-card"><h2>${esc(title)}</h2>${text?`<p class="hint">${esc(text)}</p>`:""}${fields.map(f=>`<label class="fld"><span>${esc(f.label)}</span><input id="dlg-${f.id}" type="${f.type||"text"}" ${f.inputmode?`inputmode="${f.inputmode}"`:""} placeholder="${esc(f.placeholder||"")}" value="${esc(f.value||"")}" maxlength="${f.max||40}" autocomplete="off"></label>`).join("")}<p class="err" id="dlg-err"></p><div class="row" style="justify-content:flex-end;margin-top:10px">${cancel?`<button class="btn" data-x="0">${esc(cancel)}</button>`:""}<button class="btn ${danger?"warn":"primary"}" data-x="1">${esc(ok)}</button></div></div>`;
    m.classList.add("open");
    const first=m.querySelector("input"); if(first) setTimeout(()=>first.focus(),60);
    const finish=v=>{ m.classList.remove("open"); m.innerHTML=""; m.onclick=null; m.onkeydown=null; res(v); };
    m.onclick=e=>{ const b=e.target.closest("button[data-x]"); if(!b) return; if(b.dataset.x==="0") return finish(null); const out={}; fields.forEach(f=>out[f.id]=m.querySelector("#dlg-"+f.id).value.trim()); finish(out); };
    m.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); m.querySelector('button[data-x="1"]').click(); } if(e.key==="Escape" && cancel) finish(null); };
  });
}
const confirmBox = (title, text, ok="確定") => dialog({title, text, ok, danger:true}).then(v=>!!v);

/* ============ 資料層：Firebase 或本機 ============ */
const qs = new URLSearchParams(location.search);
let DB_URL = FIREBASE_DB_URL || qs.get("db") || ls("bm-dburl") || "";
let fb = null;
function initFirebase(url){
  if (!url || typeof firebase==="undefined") return null;
  try { const app = firebase.apps.length ? firebase.app() : firebase.initializeApp({databaseURL:url}); return app.database(); }
  catch(e){ console.warn(e); return null; }
}
const local = (() => {
  let tree={}; try { tree=JSON.parse(ls("bm-local")||"{}"); } catch {}
  const subs=new Set();
  const keys=p=>p.split("/").filter(Boolean);
  const get=p=>keys(p).reduce((o,k)=>o==null?undefined:o[k], tree);
  const clean=v=>JSON.parse(JSON.stringify(v, (k,x)=>x===null?undefined:x));
  function setAt(p,v){ const ks=keys(p); let o=tree; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=="object"||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } const last=ks[ks.length-1]; if(v===null||v===undefined) delete o[last]; else o[last]=clean(v); }
  const snap=p=>{ const v=get(p); return {val:()=>v===undefined?null:JSON.parse(JSON.stringify(v)), exists:()=>v!==undefined}; };
  let pend=false;
  function commit(){ lsSet("bm-local", JSON.stringify(tree)); if(pend) return; pend=true; queueMicrotask(()=>{ pend=false; subs.forEach(s=>s.cb(snap(s.path))); }); }
  function ref(p){ return {
    set(v){ setAt(p,v); commit(); return Promise.resolve(); },
    update(obj){ for(const [k,v] of Object.entries(obj)) setAt(p+"/"+k, v); commit(); return Promise.resolve(); },
    remove(){ setAt(p,null); commit(); return Promise.resolve(); },
    once(){ return Promise.resolve(snap(p)); },
    on(ev,cb){ const s={path:p,cb}; subs.add(s); queueMicrotask(()=>cb(snap(p))); s.off=()=>subs.delete(s); return s; },
    transaction(fn){ const r=fn(snap(p).val()); if(r!==undefined){ setAt(p,r); commit(); return Promise.resolve({committed:true}); } return Promise.resolve({committed:false}); },
    onDisconnect(){ return {remove(){ return Promise.resolve(); }}; },
  }; }
  return {ref};
})();
const ref = p => fb ? fb.ref(p) : local.ref(p);
function listen(p, cb){
  if (fb){ const r=fb.ref(p); const h=s=>cb(s.val()); r.on("value", h, e=>{ console.warn(e); toast("讀取失敗：請確認資料庫規則"); }); return ()=>r.off("value",h); }
  const s=local.ref(p).on("value", snap=>cb(snap.val())); return s.off;
}
function onWriteError(e){
  console.warn(e);
  if (e && /permission/i.test(e.code||e.message||"")) toast("資料庫拒絕寫入：請檢查 Firebase 規則");
  else toast("儲存失敗，請檢查網路");
}
const w = p => p.catch(onWriteError);

const S = {
  cfg: {...DEFAULT_CFG},
  tokens: {}, templates: {}, combat: {round:1, turn:0, order:[]},
  me: ls("bm-dev") || (()=>{ const v="d"+uid(); lsSet("bm-dev",v); return v; })(),
  myName: ls("bm-name") || "",
  isGM: false, online: false, room: "", meta: null,
  view: {x:40, y:40, s:44},
  tool: "select", coneAngle: 90, patterns: {}, patSel: ls("bm-pat")||"",
  sel: null, selTpl: null, preview: false,
  drag: null, draft: null, ruler: null, paint: null, tplDrag: null,
  peers: {}, saves: [], tab: "token", tokensReady:false,
};
let R = ""; // 房間路徑

/* ============ 寫入 ============ */
function putToken(id, data){ S.tokens[id] = data; w(ref(`${R}/tokens/${id}`).set(data)); visCache.key=null; draw(); }
function patchToken(id, patch){ if(!S.tokens[id]) return; const n={...S.tokens[id], ...patch}; for(const k in patch) if(patch[k]===null) delete n[k]; S.tokens[id]=n; w(ref(`${R}/tokens/${id}`).update(patch)); visCache.key=null; draw(); }
function delToken(id){ delete S.tokens[id]; if (S.sel===id) S.sel=null; w(ref(`${R}/tokens/${id}`).remove()); visCache.key=null; draw(); }
function putTemplate(id, data){ S.templates[id] = data; w(ref(`${R}/templates/${id}`).set(data)); draw(); }
function delTemplate(id){ delete S.templates[id]; w(ref(`${R}/templates/${id}`).remove()); draw(); }
function patchCfg(patch){ S.cfg = {...S.cfg, ...patch}; visCache.key=null; w(ref(`${R}/cfg`).update(patch)); draw(); }
function putCombat(c){ S.combat = c; w(ref(`${R}/combat`).set(c)); renderPanel(); updateHud(); draw(); }
function removeFromCombat(tid){
  const c=S.combat, order=c.order||[]; if (!order.some(e=>e.tid===tid)) return;
  const cur=order[c.turn]; const nord=order.filter(e=>e.tid!==tid);
  let turn=cur && cur.tid!==tid ? nord.indexOf(cur) : Math.min(c.turn, Math.max(0,nord.length-1));
  putCombat({...c, order:nord, turn:Math.max(0,turn)});
}
function pruneCombat(){
  const c=S.combat, order=c.order||[];
  if (!order.some(e=>e.tid && !S.tokens[e.tid])) return;
  const cur=order[c.turn]; const nord=order.filter(e=>!(e.tid && !S.tokens[e.tid]));
  let turn=nord.indexOf(cur); if (turn<0) turn=Math.min(c.turn, nord.length-1);
  putCombat({...c, order:nord, turn:Math.max(0,turn)});
}
function normOrder(o){ if (!o) return []; if (Array.isArray(o)) return o.filter(Boolean); return Object.keys(o).sort((a,b)=>a-b).map(k=>o[k]).filter(Boolean); }

/* ============ 權限 ============ */
const canControl = t => t && (S.isGM || t.ownerId === S.me);
const canDeleteTpl = t => t && (S.isGM || t.ownerId === S.me);
const isCreator = t => t && t.createdBy === S.me;

function nameOf(id){ if(!id) return ""; if (id===S.me) return "你"; if (S.peers[id]?.name) return S.peers[id].name; const t=Object.values(S.tokens).find(t=>t.ownerId===id&&t.ownerName); return t ? t.ownerName : "玩家"; }

/* ============ 視野 / 戰爭迷霧 ============ */
const visCache = {key:null, set:null};
function isWall(cx, cy){ const {cols,rows}=S.cfg; if(cx<0||cy<0||cx>=cols||cy>=rows) return true; return bitGet(S.cfg.walls||"", cy*cols+cx); }
function losClear(sx, sy, tx, ty, tcx, tcy){
  const dx=tx-sx, dy=ty-sy, len=Math.hypot(dx,dy), steps=Math.max(1, Math.ceil(len/0.2));
  for(let i=1;i<steps;i++){ const x=sx+dx*i/steps, y=sy+dy*i/steps, cx=Math.floor(x), cy=Math.floor(y); if (cx===tcx && cy===tcy) continue; if (isWall(cx,cy)) return false; }
  return true;
}
function viewers(){
  const out=[];
  for (const t of Object.values(S.tokens)){
    if (t.hidden || !t.ownerId) continue;
    if (S.isGM || t.ownerId===S.me || S.cfg.shareVision) out.push(t);
  }
  return out;
}
function hash(s){ s=s||""; let h=s.length; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return h; }
function visibleCells(){
  const {cols,rows} = S.cfg, vs = viewers();
  const key = JSON.stringify([cols,rows,hash(S.cfg.walls),hash(S.cfg.reveal),S.cfg.meters,S.isGM,vs.map(t=>[t.x,t.y,t.size,t.vision])]);
  if (visCache.key === key) return visCache.set;
  const vis = new Uint8Array(cols*rows), rv = ensureBits(S.cfg.reveal);
  for (let i=0;i<vis.length;i++) if (rv.charCodeAt(i)===49) vis[i]=1;
  for (const t of vs){
    const f=FOOT[t.size]||1, sx=t.x+f/2, sy=t.y+f/2, r=Math.max(0,(+t.vision||0)/S.cfg.meters)+f/2;
    for (let cy=Math.floor(t.y); cy<Math.ceil(t.y+f); cy++) for (let cx=Math.floor(t.x); cx<Math.ceil(t.x+f); cx++) if(cx>=0&&cy>=0&&cx<cols&&cy<rows) vis[cy*cols+cx]=1;
    const x0=Math.max(0,Math.floor(sx-r)), x1=Math.min(cols-1,Math.ceil(sx+r)), y0=Math.max(0,Math.floor(sy-r)), y1=Math.min(rows-1,Math.ceil(sy+r));
    for (let cy=y0; cy<=y1; cy++) for (let cx=x0; cx<=x1; cx++){
      const i=cy*cols+cx; if (vis[i]) continue;
      if (Math.hypot(cx+.5-sx, cy+.5-sy) > r) continue;
      if (losClear(sx,sy,cx+.5,cy+.5,cx,cy) || losClear(sx,sy,cx+.15,cy+.15,cx,cy) || losClear(sx,sy,cx+.85,cy+.15,cx,cy) || losClear(sx,sy,cx+.15,cy+.85,cx,cy) || losClear(sx,sy,cx+.85,cy+.85,cx,cy)) vis[i]=1;
    }
  }
  visCache.key=key; visCache.set=vis; return vis;
}
const fogActive = () => S.cfg.fog && (!S.isGM || S.preview);
function tokenSeen(t){
  if (t.hidden && !S.isGM) return false;
  if (!fogActive() || t.ownerId===S.me) return true;
  const vis=visibleCells(), {cols,rows}=S.cfg, f=FOOT[t.size]||1;
  for (let cy=Math.floor(t.y); cy<Math.ceil(t.y+f); cy++) for (let cx=Math.floor(t.x); cx<Math.ceil(t.x+f); cx++) if(cx>=0&&cy>=0&&cx<cols&&cy<rows&&vis[cy*cols+cx]) return true;
  return false;
}

/* ============ 範圍形狀 ============ */
function normT(t){
  if (t.shape==="rect" && t.cx==null){
    const x0=Math.min(t.x0,t.x1), x1=Math.max(t.x0,t.x1), y0=Math.min(t.y0,t.y1), y1=Math.max(t.y0,t.y1);
    const n={...t, cx:(x0+x1+1)/2, cy:(y0+y1+1)/2, w:x1-x0+1, h:y1-y0+1, ang:t.ang||0};
    delete n.x0; delete n.x1; delete n.y0; delete n.y1; return n;
  }
  return t;
}
/* 自訂範圍：以 45° 為單位在方形環上旋轉（直線、對角線都能精準對應） */
function ringRot(dx,dy,k){
  const r=Math.max(Math.abs(dx),Math.abs(dy)); k=((k%8)+8)%8; if (!r || !k) return [dx,dy];
  let i; if (dy===-r && dx<r) i=dx+r; else if (dx===r && dy<r) i=3*r+dy; else if (dy===r && dx>-r) i=5*r-dx; else i=7*r-dy;
  const n=8*r; i=(i+k*r)%n;
  if (i<2*r) return [i-r,-r]; if (i<4*r) return [r,i-3*r]; if (i<6*r) return [5*r-i,r]; return [-r,7*r-i];
}
const patList = str => (str||"").split(";").filter(Boolean).map(c=>c.split(",").map(Number)).filter(a=>a.length===2&&a.every(Number.isFinite));
const patStep = ang => Math.round(((ang||0)+Math.PI/2)/(Math.PI/4));
const patReach = str => Math.max(1, ...patList(str).map(([x,y])=>Math.max(Math.abs(x),Math.abs(y))));
function shiftT(t,dx,dy){ return t.shape==="rect" ? {...t,cx:t.cx+dx,cy:t.cy+dy} : {...t,ox:t.ox+dx,oy:t.oy+dy}; }
function tokPos(id){
  const t=S.tokens[id]; if(!t) return null;
  if (S.drag && S.drag.id===id) return {x:S.drag.x,y:S.drag.y};
  for (const [pid,p] of Object.entries(S.peers)) if (pid!==S.me && p && p.drag && p.drag.id===id) return {x:+p.drag.x,y:+p.drag.y};
  return {x:t.x,y:t.y};
}
function bindShift(g){ if (!g.bind) return [0,0]; const p=tokPos(g.bind.tid); return p ? [p.x-g.bind.ax, p.y-g.bind.ay] : [0,0]; }
function effT(id,t){ // 實際顯示的位置（含拖曳中與綁定偏移）
  const g = (S.tplDrag && S.tplDrag.id===id) ? S.tplDrag.geom : normT(t);
  const [bx,by]=bindShift(g); return (bx||by) ? shiftT(g,bx,by) : g;
}
function tplHandle(g){
  if (g.shape==="pat"){ const d=patReach(g.cells)+0.9; return [g.ox+Math.cos(g.ang)*d, g.oy+Math.sin(g.ang)*d]; }
  const r=(g.len||0)/S.cfg.meters;
  if (g.shape==="circle") return [g.ox+r, g.oy];
  if (g.shape==="rect"){ const a=g.ang||0, d=g.w/2+0.7; return [g.cx+Math.cos(a)*d, g.cy+Math.sin(a)*d]; }
  return [g.ox+Math.cos(g.ang)*r, g.oy+Math.sin(g.ang)*r];
}
function snapRectCenter(g){
  const a=g.ang||0, c=Math.abs(Math.cos(a)), sn=Math.abs(Math.sin(a));
  if (Math.min(c,sn)>1e-3) return g;
  const ex=Math.round(g.w*c+g.h*sn), ey=Math.round(g.w*sn+g.h*c);
  const f=(v,e)=> e%2 ? Math.floor(v)+0.5 : Math.round(v);
  return {...g, cx:f(g.cx,ex), cy:f(g.cy,ey)};
}
function tplCells(t){
  t=normT(t);
  const {cols,rows}=S.cfg, out=[];
  if (t.shape==="pat"){ const bx=Math.floor(t.ox), by=Math.floor(t.oy), k=patStep(t.ang);
    for (const [dx,dy] of patList(t.cells)){ const [rx,ry]=ringRot(dx,dy,k), x=bx+rx, y=by+ry; if (x>=0&&y>=0&&x<cols&&y<rows) out.push([x,y]); }
    return out; }
  if (t.shape==="rect"){
    const a=t.ang||0, ux=Math.cos(a), uy=Math.sin(a), rr=Math.hypot(t.w,t.h)/2+1;
    for (let y=Math.max(0,Math.floor(t.cy-rr)); y<=Math.min(rows-1,Math.ceil(t.cy+rr)); y++)
      for (let x=Math.max(0,Math.floor(t.cx-rr)); x<=Math.min(cols-1,Math.ceil(t.cx+rr)); x++){
        const dx=x+.5-t.cx, dy=y+.5-t.cy, p=dx*ux+dy*uy, q=-dx*uy+dy*ux;
        if (Math.abs(p)<t.w/2-1e-6 && Math.abs(q)<t.h/2-1e-6) out.push([x,y]);
      }
    return out;
  }
  const r = t.len / S.cfg.meters;
  const x0=Math.max(0,Math.floor(t.ox-r-1)), x1=Math.min(cols-1,Math.ceil(t.ox+r+1)), y0=Math.max(0,Math.floor(t.oy-r-1)), y1=Math.min(rows-1,Math.ceil(t.oy+r+1));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const dx=x+.5-t.ox, dy=y+.5-t.oy, d=Math.hypot(dx,dy);
    if (t.shape==="circle"){ if (d<=r+1e-6) out.push([x,y]); }
    else if (t.shape==="cone"){
      if (d>r+1e-6 || d<1e-6) continue;
      let a=Math.atan2(dy,dx)-t.ang; a=Math.atan2(Math.sin(a),Math.cos(a));
      if (Math.abs(a) <= (t.spread*Math.PI/180)/2 + 1e-6) out.push([x,y]);
    } else if (t.shape==="line"){
      const ux=Math.cos(t.ang), uy=Math.sin(t.ang), p=dx*ux+dy*uy, q=Math.abs(-dx*uy+dy*ux);
      if (p>=0 && p<=r && q<=0.5*(t.width||1)) out.push([x,y]);
    }
  }
  return out;
}
function tplLabel(t){
  t=normT(t); const m=S.cfg.meters;
  if (t.shape==="rect") return `${t.w*m}×${t.h*m} 米`;
  if (t.shape==="circle") return `半徑 ${fmtM(t.len)}`;
  if (t.shape==="cone") return `錐形 ${fmtM(t.len)} · ${t.spread}°`;
  if (t.shape==="pat") return t.name || "自訂範圍";
  return `直線 ${fmtM(t.len)}`;
}

/* ============ 畫布 ============ */
const cv=$("#cv"), ctx=cv.getContext("2d");
let bgImg=null, bgData=null;
function setBgData(data){ if (data===bgData) return; bgData=data; bgImg=null; if(!data){ draw(); return; } const im=new Image(); im.onload=()=>{ bgImg=im; draw(); }; im.src=data; }
function bgBox(){ // 底圖在格子座標中的位置；沒設定寬度時沿用舊版「拉伸填滿」
  const c=S.bgDraft||S.cfg, {cols,rows}=S.cfg;
  if (!(+c.bgW>0) || !bgImg) return {x:0,y:0,w:cols,h:rows};
  const w=+c.bgW; return {x:+c.bgX||0, y:+c.bgY||0, w, h:w*bgImg.naturalHeight/bgImg.naturalWidth};
}
function bgFields(){ const b=bgBox(); return {bgX:b.x, bgY:b.y, bgW:b.w}; }
const r2 = v => Math.round(v*100)/100;
function bgScale(k, ax, ay){ // 以 (ax,ay) 為錨點縮放底圖
  if (!bgImg) return; const b=bgFields(), nw=clamp(b.bgW*k,1,MAX_GRID*4), q=nw/b.bgW;
  patchCfg({bgW:r2(nw), bgX:r2(ax-(ax-b.bgX)*q), bgY:r2(ay-(ay-b.bgY)*q)});
}
function resize(){ const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); draw(); }
const s2w=(x,y)=>[(x-S.view.x)/S.view.s, (y-S.view.y)/S.view.s];
let raf=0; function draw(){ if(!raf) raf=requestAnimationFrame(()=>{raf=0; paint();}); }
function currentEntry(){ const c=S.combat; return (c.order||[])[c.turn]; }

function paint(){
  const d=window.devicePixelRatio||1, W=cv.width/d, H=cv.height/d;
  ctx.setTransform(d,0,0,d,0,0);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--table").trim()||"#24322f";
  ctx.fillRect(0,0,W,H);
  const {cols,rows}=S.cfg, s=S.view.s;
  ctx.save(); ctx.translate(S.view.x,S.view.y);
  ctx.fillStyle="#3a4a46"; ctx.fillRect(0,0,cols*s,rows*s);
  if (bgImg){ const b=bgBox();
    if (S.tool==="bg" && S.isGM){ ctx.globalAlpha=.35; ctx.drawImage(bgImg,b.x*s,b.y*s,b.w*s,b.h*s); ctx.globalAlpha=1; }
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,cols*s,rows*s); ctx.clip(); ctx.drawImage(bgImg,b.x*s,b.y*s,b.w*s,b.h*s); ctx.restore();
    if (S.tool==="bg" && S.isGM){ ctx.strokeStyle="#ffd36a"; ctx.lineWidth=2; ctx.setLineDash([8,5]); ctx.strokeRect(b.x*s,b.y*s,b.w*s,b.h*s); ctx.setLineDash([]); } }
  const walls=ensureBits(S.cfg.walls);
  ctx.fillStyle="rgba(18,20,22,.86)";
  for(let i=0;i<walls.length;i++) if(walls.charCodeAt(i)===49){ ctx.fillRect((i%cols)*s,((i/cols)|0)*s,s,s); }
  ctx.strokeStyle="rgba(210,190,140,.55)"; ctx.lineWidth=1;
  for(let i=0;i<walls.length;i++) if(walls.charCodeAt(i)===49){ const x=i%cols, y=(i/cols)|0; ctx.beginPath(); ctx.moveTo(x*s,y*s+s); ctx.lineTo(x*s+s,y*s); ctx.stroke(); }
  ctx.strokeStyle="rgba(232,238,226,.28)"; ctx.lineWidth=1; ctx.beginPath();
  for(let x=0;x<=cols;x++){ ctx.moveTo(x*s+.5,0); ctx.lineTo(x*s+.5,rows*s); }
  for(let y=0;y<=rows;y++){ ctx.moveTo(0,y*s+.5); ctx.lineTo(cols*s,y*s+.5); }
  ctx.stroke(); ctx.strokeStyle="rgba(232,238,226,.6)"; ctx.strokeRect(0,0,cols*s,rows*s);

  const tpls=Object.entries(S.templates).map(([id,t])=>({id,...effT(id,t)}));
  if (S.draft) tpls.push({id:"__draft",...normT(S.draft)});
  const hitCells=new Set();
  for (const t of tpls){
    const col=t.color||"#e0603a", selected=S.selTpl===t.id;
    ctx.fillStyle=hexA(col, selected?.42:.32);
    for (const [x,y] of tplCells(t)){ ctx.fillRect(x*s,y*s,s,s); hitCells.add(x+","+y); }
    ctx.beginPath();
    if (t.shape==="rect"){ const a=t.ang||0, ux=Math.cos(a), uy=Math.sin(a), hw=t.w/2*s, hh=t.h/2*s, cx=t.cx*s, cy=t.cy*s;
      const pts=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([px,py])=>[cx+px*ux-py*uy, cy+px*uy+py*ux]);
      ctx.moveTo(...pts[0]); for (let i=1;i<4;i++) ctx.lineTo(...pts[i]); ctx.closePath(); }
    else if (t.shape==="pat"){ for (const [x,y] of tplCells(t)) ctx.rect(x*s+1.5,y*s+1.5,s-3,s-3);
      if (t.id==="__draft"){ const [hx,hy]=tplHandle(t); ctx.moveTo(t.ox*s,t.oy*s); ctx.lineTo(hx*s,hy*s); } }
    else { const r=t.len/S.cfg.meters*s;
      if (t.shape==="circle") ctx.arc(t.ox*s,t.oy*s,r,0,Math.PI*2);
      else if (t.shape==="cone"){ const h=t.spread*Math.PI/360; ctx.moveTo(t.ox*s,t.oy*s); ctx.arc(t.ox*s,t.oy*s,r,t.ang-h,t.ang+h); ctx.closePath(); }
      else { const ww=(t.width||1)/2*s, ux=Math.cos(t.ang), uy=Math.sin(t.ang), px=-uy*ww, py=ux*ww, ex=t.ox*s+ux*r, ey=t.oy*s+uy*r;
        ctx.moveTo(t.ox*s+px,t.oy*s+py); ctx.lineTo(ex+px,ey+py); ctx.lineTo(ex-px,ey-py); ctx.lineTo(t.ox*s-px,t.oy*s-py); ctx.closePath(); }
    }
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.setLineDash(t.id==="__draft"?[6,4]:[]); ctx.stroke();
    if (selected){ ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.setLineDash([4,4]); ctx.stroke(); }

    if (gesture.tapDeselect){ S.sel=null; renderPanel(); }

        if (mp && mp.x===x && mp.y===y) doMovePrev();           // 第二下點同一格：確認移動
        else if (mp || (x===t.x && y===t.y)) clearSel();         // 點其他地方：取消
        else S.movePrev={id:S.sel,x,y};                           // 第一下：預覽
      } }
  }
  if (gesture.type==="tpl" && S.draft){
    const t=S.draft; S.draft=null;
    if (t.shape==="pat") S.patAng=t.ang;
    if (!gesture.moved && t.shape!=="pat") toast("按住後拖曳，拉出範圍大小");
    else { const id=uid(); putTemplate(id,{...normT(t), ownerId:S.me, at:Date.now()}); S.selTpl=id; S.sel=null; S.tool="select"; renderTools(); renderPanel();

        else if (g.shape!=="rect") g={...g, ox:tk.x+f/2, oy:tk.y+f/2};
        g={...g, bind:{tid:gesture.bindTo, ax:tk.x, ay:tk.y}};

      } else if (gesture.type==="tplrot" || gesture.moved) putTemplate(gesture.id, g);

  }
  if (gesture.type==="paint" && S.paint){
    const {mode,value,cells}=S.paint; S.paint=null;
    const {cols}=S.cfg, arr=ensureBits(S.cfg[mode]).split("");

}

function entryTok(e){ return e.tid ? S.tokens[e.tid] : null; }
function entryName(e){ const t=entryTok(e); return t ? t.name : (e.name || "已移除"); }
function entryHidden(e){ const t=entryTok(e); return !!(t && t.hidden); }
function isMineEntry(e){ const t=entryTok(e); return !!(t && t.ownerId===S.me); }
function canEditEntry(e){ return S.isGM || isMineEntry(e) || e.by===S.me; }
function panelInit(){
  const c=S.combat, order=c.order||[], cur=currentEntry();
  const curName = cur ? (entryHidden(cur)&&!S.isGM ? "？？？" : entryName(cur)) : "";
  let h=`<div class="row"><span class="num" style="font-size:22px;font-weight:600">第 ${c.round||1} 輪</span><span class="hint">${order.length?`輪到：<b>${esc(curName)}</b>`:"還沒有人加入"}</span></div>`;
  if (S.isGM) h+=`<div class="row"><button class="btn" data-act="initPrev" ${order.length?"":"disabled"}>上一位</button><button class="btn gm" data-act="initNext" ${order.length?"":"disabled"}>下一位</button><button class="btn" data-act="initSort" ${order.length>1?"":"disabled"}>依先攻排序</button></div>`;
  else if (cur && isMineEntry(cur)) h+=`<div class="row"><button class="btn primary" data-act="initNext">結束我的回合</button></div>`;
  h+=`<h3>順序</h3>`;
  const rows=order.map((e,i)=>({e,i})).filter(({e})=>S.isGM||!entryHidden(e));
  if (!rows.length) h+=`<p class="empty">${S.isGM?"把棋子加進來，填好先攻再排序。":"GM 還沒開始排回合。"}</p>`;
  else h+=`<div class="list">`+rows.map(({e,i})=>{
    const t=entryTok(e), ed=canEditEntry(e), now=i===c.turn;
    return `<div class="item" style="${now?"border:2px solid var(--brass)":""}"><span class="num meta" style="width:18px;text-align:right">${now?"▶":i+1}</span><span class="dot" style="background:${esc(t?t.color:"#888")}"></span><span class="nm">${esc(entryName(e))}${entryHidden(e)?' <span class="meta">（隱藏）</span>':""}</span><input type="number" inputmode="numeric" class="num" style="width:62px" data-ini="${i}" value="${e.init??""}" placeholder="先攻" aria-label="先攻" ${ed?"":"disabled"}>${S.isGM?`<button class="btn" data-act="initUp" data-i="${i}" aria-label="上移" ${i?"":"disabled"}>↑</button><button class="btn" data-act="initDown" data-i="${i}" aria-label="下移" ${i<order.length-1?"":"disabled"}>↓</button>`:""}${ed?`<button class="btn warn" data-act="initRemove" data-i="${i}" aria-label="移出順序">×</button>`:""}</div>`;
  }).join("")+`</div>`;
  const inOrder=new Set(order.map(e=>e.tid).filter(Boolean));
  const addable=Object.entries(S.tokens).filter(([id,t])=>!inOrder.has(id) && (S.isGM || t.ownerId===S.me));
  h+=`<h3>加入</h3>`;
  h+= addable.length ? `<div class="list">`+addable.map(([id,t])=>`<div class="item">${tokDot(t)}<span class="nm">${esc(t.name)}</span><button class="btn" data-act="addInit" data-id="${id}">加入</button></div>`).join("")+`</div>` : `<p class="empty">${S.isGM?"地圖上的棋子都已加入。":"你的棋子都已加入。"}</p>`;
  if (S.isGM){
    h+=`${addable.length>1?`<div class="row"><button class="btn" data-act="initAddAll">全部加入</button></div>`:""}
    <div class="row"><input type="text" id="iCustom" placeholder="不在地圖上的項目，例如：毒霧擴散" maxlength="24" aria-label="自訂項目名稱"><button class="btn" data-act="initCustom">加入</button></div>
    <h3>結束戰鬥</h3><div class="row"><button class="btn warn" data-act="initReset">清空順序並回到第 1 輪</button></div>`;
  }
  return h;
}

body.addEventListener("click", async e => {

  if (a==="initUp"||a==="initDown"){ const i=+b.dataset.i, j=a==="initUp"?i-1:i+1, c=S.combat, order=[...c.order]; if(j<0||j>=order.length) return; const cur=order[c.turn]; [order[i],order[j]]=[order[j],order[i]]; putCombat({...c, order, turn:order.indexOf(cur)}); }
  if (a==="initRemove"){ const i=+b.dataset.i, c=S.combat, en=c.order[i]; if(!en||!canEditEntry(en)) return; const cur=c.order[c.turn]; const order=c.order.filter((_,k)=>k!==i); const turn= cur===en ? Math.min(c.turn, order.length-1) : order.indexOf(cur); putCombat({...c, order, turn:Math.max(0,turn)}); }

/* ============ 圖片裁切與壓縮 ============ */
function loadImageFile(file){
  return new Promise((res,rej)=>{
    if (!file || !/^image\//.test(file.type||"image/")) return rej(new Error("請選擇圖片檔"));
    const url=URL.createObjectURL(file), i=new Image();
    i.onload=()=>res({im:i,url}); i.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("讀不到這張圖片")); }; i.src=url;
  });
}
/* 回傳 {im, url, x, y, w, h}（原圖像素座標）或 null（取消） */
async function cropImage(file, {square=false, title="裁切圖片", hint=""}={}){
  const {im,url}=await loadImageFile(file);
  const iw=im.naturalWidth, ih=im.naturalHeight;
  const full={x:0,y:0,w:iw,h:ih};
  const sq=()=>{ const s=Math.min(iw,ih); return {x:(iw-s)/2,y:(ih-s)/2,w:s,h:s}; };
  let R0 = square ? sq() : {...full};
  return new Promise(res=>{
    const m=$("#modal");
    m.innerHTML=`<div class="gate-card crop-card"><h2>${esc(title)}</h2><p class="hint">${esc(hint||"拖曳框框移動，拖四個角調整大小。")}</p>
      <div class="crop-wrap"><canvas id="cropCv"></canvas></div>
      <p class="hint" id="cropInfo"></p>
      <div class="row" style="justify-content:space-between;margin-top:6px"><span>${square?"":`<button class="btn" data-c="full">整張圖</button>`}<button class="btn" data-c="reset">${square?"置中":"重設"}</button></span>
      <span><button class="btn" data-c="0">取消</button> <button class="btn primary" data-c="1">確定</button></span></div></div>`;
    m.classList.add("open");
    const cv=m.querySelector("#cropCv"), c2=cv.getContext("2d"), wrap=m.querySelector(".crop-wrap");
    let k=1, ox=0, oy=0, g=null;
    const layout=()=>{
      const dpr=window.devicePixelRatio||1, W=wrap.clientWidth||300, H=Math.min(window.innerHeight*0.55, 460);
      k=Math.min(W/iw, H/ih); const cw=Math.round(iw*k), ch=Math.round(ih*k);
      cv.style.width=cw+"px"; cv.style.height=ch+"px"; cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
      c2.setTransform(dpr,0,0,dpr,0,0); paintC();
    };
    const paintC=()=>{
      const cw=iw*k, ch=ih*k, r={x:R0.x*k,y:R0.y*k,w:R0.w*k,h:R0.h*k};
      c2.clearRect(0,0,cw,ch); c2.drawImage(im,0,0,cw,ch);
      c2.fillStyle="rgba(0,0,0,.55)"; c2.beginPath(); c2.rect(0,0,cw,ch);
      if (square){ c2.moveTo(r.x+r.w,r.y+r.h/2); c2.arc(r.x+r.w/2,r.y+r.h/2,r.w/2,0,Math.PI*2,true); }
      else c2.rect(r.x+r.w,r.y,-r.w,r.h);
      c2.fill("evenodd");
      c2.strokeStyle="#fff"; c2.lineWidth=2; c2.setLineDash(square?[5,4]:[]); c2.strokeRect(r.x,r.y,r.w,r.h); c2.setLineDash([]);
      if (!square){ c2.strokeStyle="rgba(255,255,255,.35)"; c2.lineWidth=1; c2.beginPath(); for (let i=1;i<3;i++){ c2.moveTo(r.x+r.w*i/3,r.y); c2.lineTo(r.x+r.w*i/3,r.y+r.h); c2.moveTo(r.x,r.y+r.h*i/3); c2.lineTo(r.x+r.w,r.y+r.h*i/3); } c2.stroke(); }
      c2.fillStyle="#ffd36a"; for (const [hx,hy] of [[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]]){ c2.beginPath(); c2.arc(hx,hy,7,0,7); c2.fill(); }
      m.querySelector("#cropInfo").textContent=`裁切範圍 ${Math.round(R0.w)}×${Math.round(R0.h)} 像素（原圖 ${iw}×${ih}）`;
    };
    const pt=e=>{ const b=cv.getBoundingClientRect(); return [(e.clientX-b.left)/k, (e.clientY-b.top)/k]; };
    const minS=Math.max(8, 24/k);
    cv.onpointerdown=e=>{
      e.preventDefault(); const [px,py]=pt(e), tol=22/k;
      const cs=[[R0.x,R0.y],[R0.x+R0.w,R0.y],[R0.x,R0.y+R0.h],[R0.x+R0.w,R0.y+R0.h]];
      let best=-1, bd=1e9; cs.forEach(([cx,cy],i)=>{ const d=Math.hypot(cx-px,cy-py); if (d<tol && d<bd){ bd=d; best=i; } });
      if (best>=0){ const [ax,ay]=cs[3-best]; g={t:"rs",ax,ay}; }
      else if (px>=R0.x && px<=R0.x+R0.w && py>=R0.y && py<=R0.y+R0.h) g={t:"mv",sx:px,sy:py,x:R0.x,y:R0.y};
      else return;
      try{ cv.setPointerCapture(e.pointerId); }catch{}
    };
    cv.onpointermove=e=>{
      if (!g) return; const [px,py]=pt(e);
      if (g.t==="mv"){ R0.x=clamp(g.x+px-g.sx,0,iw-R0.w); R0.y=clamp(g.y+py-g.sy,0,ih-R0.h); }
      else {
        const dx=px>=g.ax?1:-1, dy=py>=g.ay?1:-1, maxW=dx>0?iw-g.ax:g.ax, maxH=dy>0?ih-g.ay:g.ay;
        let w=Math.abs(px-g.ax), h=Math.abs(py-g.ay);
        if (square){ const s=clamp(Math.max(w,h),Math.min(minS,maxW,maxH),Math.min(maxW,maxH)); w=h=s; }
        else { w=clamp(w,Math.min(minS,maxW),maxW); h=clamp(h,Math.min(minS,maxH),maxH); }
        R0={x:dx>0?g.ax:g.ax-w, y:dy>0?g.ay:g.ay-h, w, h};
      }
      paintC();
    };
    cv.onpointerup=cv.onpointercancel=()=>{ g=null; };
    const onRs=()=>layout(); window.addEventListener("resize",onRs);
    const finish=v=>{ window.removeEventListener("resize",onRs); m.classList.remove("open"); m.innerHTML=""; m.onclick=null; m.onkeydown=null; if(!v) URL.revokeObjectURL(url); res(v); };
    m.onclick=e=>{ const b=e.target.closest("button[data-c]"); if(!b) return; const c=b.dataset.c;
      if (c==="0") return finish(null);
      if (c==="1") return finish({im,url,x:Math.round(R0.x),y:Math.round(R0.y),w:Math.max(1,Math.round(R0.w)),h:Math.max(1,Math.round(R0.h))});
      if (c==="full") R0={...full}; if (c==="reset") R0= square ? sq() : {...full}; paintC(); };
    m.onkeydown=e=>{ if(e.key==="Escape") finish(null); if(e.key==="Enter") m.querySelector('button[data-c="1"]').click(); };
    requestAnimationFrame(layout);
  });
}
function cropToCanvas(cr, maxSide){
  const s=Math.min(1, maxSide/Math.max(cr.w,cr.h)), c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(cr.w*s)); c.height=Math.max(1,Math.round(cr.h*s));
  const x=c.getContext("2d"); x.imageSmoothingQuality="high"; x.drawImage(cr.im,cr.x,cr.y,cr.w,cr.h,0,0,c.width,c.height); return c;
}
const canWebp = (()=>{ try{ const c=document.createElement("canvas"); c.width=c.height=1; return c.toDataURL("image/webp").startsWith("data:image/webp"); }catch{ return false; } })();
/* 壓到 limit 字元以內；有 WebP 就用 WebP（保留透明），否則 JPEG */
function encodeCrop(cr, maxSide, limit, {alpha=false}={}){
  let side=maxSide, q=0.85, data="";
  for (let i=0;i<8;i++){
    const c=cropToCanvas(cr, side);
    if (canWebp) data=c.toDataURL("image/webp", q);
    else if (alpha){ data=c.toDataURL("image/png"); if (data.length>limit){ const j=document.createElement("canvas"); j.width=c.width; j.height=c.height; const x=j.getContext("2d"); x.fillStyle="#808080"; x.fillRect(0,0,j.width,j.height); x.drawImage(c,0,0); data=j.toDataURL("image/jpeg",q); } }
    else data=c.toDataURL("image/jpeg", q);
    if (data.length<=limit || side<=64) break;
    side=Math.round(side*0.8); q=Math.max(0.6,q-0.06);
  }
  return data;
}

/* ============ 地圖範本（程式繪製的底圖） ============ */
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shade(hex, k){ const n=parseInt(hex.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(v*k))); return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`; }
function mixHex(a,b,t){ const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16), m=s=>Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t); return `rgb(${m(16)},${m(8)},${m(0)})`; }
/* 小工具 */
function mpSpeckle(c, rnd, x, y, w, h, color, n, size){ c.fillStyle=color; for (let i=0;i<n;i++){ const s=size*(0.5+rnd()); c.fillRect(x+rnd()*w, y+rnd()*h, s, s); } }
function mpBlob(c, rnd, cx, cy, r, color, k=7){ c.fillStyle=color; c.beginPath(); for (let i=0;i<=k;i++){ const a=i/k*Math.PI*2, rr=r*(0.75+rnd()*0.4); const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?c.lineTo(x,y):c.moveTo(x,y); } c.closePath(); c.fill(); }
function mpTree(c, rnd, x, y, r){
  c.fillStyle="rgba(0,0,0,.28)"; c.beginPath(); c.ellipse(x+r*.25, y+r*.3, r*1.05, r*.9, 0, 0, 7); c.fill();
  const g=["#2f5a26","#3a6b2c","#29502a"][Math.floor(rnd()*3)];
  for (let i=0;i<5;i++) mpBlob(c, rnd, x+(rnd()-.5)*r*.7, y+(rnd()-.5)*r*.7, r*(0.55+rnd()*0.3), g, 9);
  for (let i=0;i<3;i++) mpBlob(c, rnd, x-r*.2+(rnd()-.5)*r*.4, y-r*.25+(rnd()-.5)*r*.4, r*(0.25+rnd()*0.15), "rgba(140,190,90,.35)", 8);
}
function mpRock(c, rnd, x, y, r){ c.fillStyle="rgba(0,0,0,.3)"; c.beginPath(); c.ellipse(x+r*.2,y+r*.25,r,r*.8,0,0,7); c.fill(); mpBlob(c,rnd,x,y,r,"#7d7a72",7); mpBlob(c,rnd,x-r*.2,y-r*.25,r*.5,"rgba(255,255,255,.18)",6); }
function mpGrass(c, rnd, W, H, P, base){
  c.fillStyle=base; c.fillRect(0,0,W,H);
  for (let i=0;i<W*H/(P*P)*3;i++) mpBlob(c, rnd, rnd()*W, rnd()*H, P*(0.4+rnd()*1.2), rnd()<.5?"rgba(255,255,200,.05)":"rgba(0,40,0,.07)", 6);
  c.lineWidth=Math.max(1,P/30); for (let i=0;i<W*H/(P*P)*14;i++){ const x=rnd()*W, y=rnd()*H; c.strokeStyle=rnd()<.5?"rgba(160,200,100,.35)":"rgba(30,60,20,.35)"; c.beginPath(); c.moveTo(x,y); c.lineTo(x+(rnd()-.5)*P*.15, y-P*.15); c.stroke(); }
}
/* 地城 / 洞穴共用：m[y][x]=1 是地板 */
function mpDrawCells(c, rnd, m, cols, rows, P, rock, floor, tiles){
  c.fillStyle=rock; c.fillRect(0,0,cols*P,rows*P);
  mpSpeckle(c, rnd, 0,0,cols*P,rows*P, "rgba(255,255,255,.05)", cols*rows*4, P*.12);
  mpSpeckle(c, rnd, 0,0,cols*P,rows*P, "rgba(0,0,0,.25)", cols*rows*4, P*.15);
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) if (m[y][x]){
    c.fillStyle=mixHex(floor, "#000000", rnd()*0.12); c.fillRect(x*P,y*P,P,P);
    if (tiles){ c.strokeStyle="rgba(0,0,0,.25)"; c.lineWidth=Math.max(1,P/32); c.strokeRect(x*P+.5,y*P+.5,P-1,P-1);
      if (rnd()<.15){ c.strokeStyle="rgba(0,0,0,.3)"; c.beginPath(); c.moveTo(x*P+rnd()*P,y*P+rnd()*P); c.lineTo(x*P+rnd()*P,y*P+rnd()*P); c.stroke(); } }
    else mpSpeckle(c, rnd, x*P,y*P,P,P, "rgba(0,0,0,.18)", 6, P*.12);
  }
  // 牆邊陰影與輪廓
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) if (m[y][x]){
    const g=(dx,dy)=>{ const yy=y+dy, xx=x+dx; return yy<0||xx<0||yy>=rows||xx>=cols||!m[yy][xx]; };
    c.fillStyle="rgba(0,0,0,.35)";
    if (g(0,-1)) c.fillRect(x*P,y*P,P,P*.22);
    if (g(-1,0)) c.fillRect(x*P,y*P,P*.16,P);
    c.fillStyle="rgba(255,255,255,.08)";
    if (g(0,1)) c.fillRect(x*P,y*P+P*.9,P,P*.1);
  }
}

}

    grid.onpointerdown=e=>{ const el=cellAt(e); if(!el) return; e.preventDefault(); paint=!cells.has(el.dataset.k); setCell(el,paint); try{ grid.setPointerCapture(e.pointerId); }catch{} };
    grid.onpointermove=e=>{ if (paint===null) return; const el=cellAt(e); if (el && cells.has(el.dataset.k)!==paint) setCell(el,paint); };
    grid.onpointerup=grid.onpointercancel=()=>{ paint=null; };
    const finish=v=>{ m.classList.remove("open"); m.innerHTML=""; m.onclick=null; m.onkeydown=null; res(v); };
    m.onclick=e=>{ const sw=e.target.closest("button[data-pc]"); if (sw){ setColor(sw.dataset.pc); return; }
      const lb=e.target.closest("label.fx"); if (lb && e.target.tagName!=="INPUT"){ e.preventDefault(); lb.querySelector("input").click(); return; }
      const b=e.target.closest("button[data-p]"); if(!b) return; const c=b.dataset.p;
      if (c==="0") return finish(null);
      if (c==="clear"){ cells.clear(); grid.querySelectorAll(".on").forEach(el=>el.classList.remove("on")); info(); return; }
      const name=m.querySelector("#patName").value.trim().slice(0,24);
      if (!name){ m.querySelector("#patErr").textContent="請取個名稱"; m.querySelector("#patName").focus(); return; }
      if (!cells.size){ m.querySelector("#patErr").textContent="至少要塗一格"; return; }
      const nid=id||uid(), data={...(p||{}), name, cells:[...cells].join(";"), color, by:p?p.by:S.me, byName:p?(p.byName||""):(S.myName||(S.isGM?"GM":"")), at:p?p.at:Date.now()};
      S.patterns[nid]=data; w(ref(`${R}/patterns/${nid}`).set(data)); renderTools(); toast(`已儲存「${name}」`); finish(nid);
    };
    m.onkeydown=e=>{ if(e.key==="Escape") finish(null); };
  });
}

/* ============ 音樂 ============ */
const KIND_NAME = {youtube:"YouTube", bilibili:"Bilibili", spotify:"Spotify", audio:"網址", file:"上傳", local:"本機"};
const AUDIO_MAX = 20*1024*1024, CHUNK = 384*1024;
const M = { state:null, off:0, vol:clamp(+(ls("bm-vol")??70),0,100), muted:ls("bm-mute")==="1", min:ls("bm-mumin")==="1", optOut:ls("bm-muoff")==="1", advKey:"",
  key:"", el:null, yt:null, ytReady:false, sp:null, spPaused:true, spStarted:false, spPos:0, spDur:0, blocked:false, loading:"", urls:{}, playlist:{}, seeking:false };
const mNow = () => Date.now()+M.off;
function mPos(st){ if(!st) return 0; return Math.max(0, st.playing ? (mNow()-(+st.t0||0))/1000 : (+st.pos||0)); }
function mDur(){ const k=M.state&&M.state.kind;
  if (M.el && (k==="audio"||k==="file"||k==="local")) return isFinite(M.el.duration)?M.el.duration:0;
  if (k==="youtube" && M.ytReady) return M.yt.getDuration()||0;
  if (k==="spotify") return M.spDur||0;
  return 0; }
function mCur(){ const st=M.state; if(!st) return 0; let p=mPos(st); const d=mDur(); if (d>0){ p = st.loop ? p%d : Math.min(p,d); } return p; }
const fmtT = t => { t=Math.max(0,Math.floor(t||0)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0"); };

function parseMusicUrl(raw){
  raw=(raw||"").trim(); if (!raw) return {err:"請先貼上網址"};
  let m=/^spotify:(track|album|playlist|episode|show|artist):([A-Za-z0-9]+)$/.exec(raw);
  if (m) return {kind:"spotify", src:`${m[1]}/${m[2]}`};
  let u; try{ u=new URL(raw); }catch{ return {err:"網址格式不對，要以 https:// 開頭"}; }
  if (!/^https?:$/.test(u.protocol)) return {err:"只支援 http / https 網址"};
  const h=u.hostname.toLowerCase().replace(/^(www|m|music)\./,"");
  if (h==="youtu.be"){ const v=u.pathname.slice(1).split("/")[0]; if(!v) return {err:"找不到 YouTube 影片 ID"}; const p=new URLSearchParams({v}); if(u.searchParams.get("list")) p.set("list",u.searchParams.get("list")); return {kind:"youtube", src:p.toString()}; }
  if (h==="youtube.com"||h.endsWith(".youtube.com")||h==="youtube-nocookie.com"){
    const v=u.searchParams.get("v") || (/\/(?:shorts|embed|live|v)\/([\w-]{11})/.exec(u.pathname)||[])[1] || "", list=u.searchParams.get("list")||"";
    if (!v && !list) return {err:"找不到 YouTube 影片或播放清單 ID"};
    const p=new URLSearchParams(); if(v) p.set("v",v); if(list) p.set("list",list); return {kind:"youtube", src:p.toString()}; }
  if (h==="b23.tv") return {err:"Bilibili 短網址無法解析，請在瀏覽器打開後複製完整的 bilibili.com/video/BV… 網址"};
  if (h.endsWith("bilibili.com")){
    const mm=/\/video\/(BV[0-9A-Za-z]{10}|av\d+)/i.exec(u.pathname); if(!mm) return {err:"找不到 Bilibili 影片編號（BV…）"};
    const p=new URLSearchParams(); if (/^av/i.test(mm[1])) p.set("aid",mm[1].slice(2)); else p.set("bvid",mm[1]); p.set("p",u.searchParams.get("p")||"1"); return {kind:"bilibili", src:p.toString()}; }
  if (h==="open.spotify.com"||h==="play.spotify.com"){
    const mm=/\/(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/.exec(u.pathname); if(!mm) return {err:"找不到 Spotify 歌曲 / 專輯 / 歌單 ID"};
    return {kind:"spotify", src:`${mm[1]}/${mm[2]}`}; }
  if (h==="dropbox.com"){ u.searchParams.delete("dl"); u.searchParams.set("raw","1"); }
  return {kind:"audio", src:u.toString()};
}
function guessTitle(p){ if (p.kind==="audio"){ try{ const n=decodeURIComponent(new URL(p.src).pathname.split("/").pop()||""); if(n) return n.replace(/\.[a-z0-9]{2,4}$/i,""); }catch{} return "音樂連結"; }
  if (p.kind==="spotify") return "Spotify "+({track:"歌曲",album:"專輯",playlist:"歌單",episode:"單集",show:"節目",artist:"歌手"}[p.src.split("/")[0]]||"");
  if (p.kind==="bilibili") return "Bilibili "+(new URLSearchParams(p.src).get("bvid")||"影片");
  if (p.kind==="youtube") return new URLSearchParams(p.src).get("v") ? "YouTube 影片" : "YouTube 播放清單";
  return "音樂"; }

/* --- 寫入（GM） --- */
function mSet(st){ M.state=st; w(ref(`${R}/music`).set(st)); applyMusic(); if (S.tab==="music") renderPanel(); }
function mLoad(tr){ const loop = M.state ? !!M.state.loop : true, all = M.state ? !!M.state.all : false;
  M.min=false; lsSet("bm-mumin",null);
  mSet({kind:tr.kind, src:tr.src, title:tr.title||"", playing:true, t0:mNow(), pos:0, loop, all, by:S.me}); }
function plSorted(){ return Object.values(M.playlist).sort((a,b)=>(a.at||0)-(b.at||0)); }
function mNext(){ // 清單循環：GM 端在一首結束時切到下一首
  const st=M.state; if (!S.isGM || !st || !st.playing || st.loop || !st.all) return;
  const k=st.src+"|"+st.t0; if (M.advKey===k) return; M.advKey=k;
  const pl=plSorted(); const i=pl.findIndex(x=>x.kind===st.kind && x.src===st.src);
  if (i<0 || pl.length<2){ mSeek(0); return; }
  mLoad(pl[(i+1)%pl.length]);
}
function loopMode(st){ return st.loop ? "one" : st.all ? "all" : "off"; }
function mPlay(){ const st=M.state; if(!st) return; const p=mCur(); mSet({...st, playing:true, t0:mNow()-p*1000}); }
function mPause(){ const st=M.state; if(!st) return; mSet({...st, playing:false, pos:r2(mCur())}); }
function mSeek(p){ const st=M.state; if(!st) return; mSet({...st, pos:r2(p), t0:mNow()-p*1000}); }
function mStop(){ M.state=null; w(ref(`${R}/music`).remove()); applyMusic(); if (S.tab==="music") renderPanel(); }

/* --- 播放引擎（每個人依共享狀態各自播放） --- */
function teardown(){
  if (M.el){ M.el.pause(); M.el.removeAttribute("src"); try{ M.el.load(); }catch{} M.el=null; }
  if (M.yt){ try{ M.yt.destroy(); }catch{} M.yt=null; M.ytReady=false; }
  if (M.sp){ try{ M.sp.destroy(); }catch{} M.sp=null; }
  M.spPaused=true; M.spStarted=false; M.spPos=0; M.spDur=0; M.blocked=false; M.loading="";
  const e=$("#muEmbed"); e.innerHTML=""; e.className=""; delete e.dataset.s;
}
function stopMusic(){ M.state=null; M.key=""; teardown(); renderMusic(); }
function loadScript(src, readyName){
  loadScript.p=loadScript.p||{}; if (loadScript.p[src]) return loadScript.p[src];
  return loadScript.p[src]=new Promise(res=>{ const prev=window[readyName]; window[readyName]=a=>{ try{ prev&&prev(a); }catch{} res(a||true); };
    const s=document.createElement("script"); s.src=src; s.async=true; s.onerror=()=>{ delete loadScript.p[src]; res(null); }; document.head.appendChild(s); });
}
async function fileUrl(id){
  if (M.urls[id]) return M.urls[id];
  const meta=(await ref(`${R}/audio/${id}`).once("value")).val(); if(!meta) throw new Error("missing");
  const parts=(await ref(`${R}/audioChunks/${id}`).once("value")).val()||{};
  const n=+meta.n||Object.keys(parts).length, bufs=[];
  for (let i=0;i<n;i++){ const b=atob(parts[i]||""); const u8=new Uint8Array(b.length); for(let j=0;j<b.length;j++) u8[j]=b.charCodeAt(j); bufs.push(u8); }
  return M.urls[id]=URL.createObjectURL(new Blob(bufs,{type:meta.type||"audio/mpeg"}));
}
function applyMusic(){
  const st=M.state, key=st&&!M.optOut?st.kind+"|"+st.src:"";
  if (key!==M.key){ M.key=key; teardown(); if (st) build(st, key); }
  syncNow(); renderMusic();
}
async function build(st, key){
  const box=$("#muEmbed"), still=()=>M.key===key;
  if (st.kind==="audio"||st.kind==="file"||st.kind==="local"){
    let src=st.src;
    if (st.kind==="file"){ M.loading="下載音樂中…"; renderMusicCtl(); try{ src=await fileUrl(st.src); }catch{ if(still()){ M.loading="音樂檔讀取失敗"; renderMusicCtl(); } return; } if(!still()) return; M.loading=""; }
    if (st.kind==="local"){ src=M.urls[st.src]; if(!src){ M.loading="單機模式上傳的檔案重新整理後就失效了，請重新選擇"; renderMusicCtl(); return; } }
    const a=new Audio(); a.preload="auto"; a.src=src; M.el=a;
    a.addEventListener("loadedmetadata", ()=>{ syncNow(); renderMusicCtl(); });
    a.addEventListener("error", ()=>{ if(M.el===a){ M.loading="無法播放這個連結（要是 mp3 / ogg / m4a 等音檔的直接連結）"; renderMusicCtl(); } });
    a.addEventListener("ended", ()=>{ if (M.el===a && M.state && M.state.loop){ a.currentTime=0; tryPlay(()=>a.play()); } else if (M.el===a) mNext(); });
    applyVol(); syncNow(); renderMusicCtl(); return;
  }
  if (st.kind==="youtube"){
    box.className="vid"; box.innerHTML="<div></div>"; M.loading="載入 YouTube…"; renderMusicCtl();
    await loadScript("https://www.youtube.com/iframe_api","onYouTubeIframeAPIReady"); if(!still()) return;
    if (!window.YT || !YT.Player){ M.loading="YouTube 載入失敗，請檢查網路"; renderMusicCtl(); return; }
    const q=new URLSearchParams(st.src), v=q.get("v"), list=q.get("list");
    const pv={playsinline:1, rel:0, origin:location.origin}; if (list){ pv.listType="playlist"; pv.list=list; }
    M.yt=new YT.Player(box.firstChild,{width:"100%",height:"100%",videoId:v||undefined,playerVars:pv,events:{
      onReady:()=>{ if(!still()) return; M.ytReady=true; M.loading=""; applyVol(); syncNow(); renderMusicCtl(); fillTitle(()=>{ try{ return M.yt.getVideoData().title; }catch{ return ""; } }); },
      onStateChange:e=>{ if (!still()) return;
        if (e.data===0 && M.state && M.state.loop){ if (list) M.yt.playVideoAt(0); else { M.yt.seekTo(0,true); M.yt.playVideo(); } }
        else if (e.data===0) mNext();
        if (e.data===1 && M.blocked){ M.blocked=false; renderMusicCtl(); } },
      onError:()=>{ if(still()){ M.loading="這部影片不允許嵌入播放，請換一部"; renderMusicCtl(); } } }});
    return;
  }
  if (st.kind==="bilibili"){ box.className="vid"; syncBili(true); return; }
  if (st.kind==="spotify"){
    box.className="sp"; box.innerHTML="<div></div>"; M.loading="載入 Spotify…"; renderMusicCtl();
    const API=await loadScript("https://open.spotify.com/embed/iframe-api/v1","onSpotifyIframeApiReady"); if(!still()) return;
    if (!API || !API.createController){ box.innerHTML=`<iframe src="https://open.spotify.com/embed/${esc(st.src)}" allow="autoplay; clipboard-write; encrypted-media; fullscreen"></iframe>`; M.loading=""; renderMusicCtl(); return; }
    API.createController(box.firstChild,{uri:"spotify:"+st.src.replace("/",":"), width:"100%", height:152}, c=>{
      if(!still()){ try{c.destroy();}catch{} return; } M.sp=c; M.loading=""; renderMusicCtl();
      c.addListener("playback_update", e=>{ const d=e.data||{}; M.spPaused=!!d.isPaused; M.spPos=(d.position||0)/1000; M.spDur=(d.duration||0)/1000; if(!d.isPaused && M.blocked){ M.blocked=false; renderMusicCtl(); } });
      c.addListener("ready", ()=>syncNow());
    });
  }
}
function fillTitle(get){ // GM 端補上自動抓到的標題
  if (!S.isGM || !M.state || M.state.title) return; const t=(get()||"").slice(0,80); if(!t) return;
  M.state={...M.state,title:t}; w(ref(`${R}/music/title`).set(t)); renderMusic();
  for (const [id,p] of Object.entries(M.playlist)) if (p.src===M.state.src && !p.title) w(ref(`${R}/playlist/${id}/title`).set(t));
  if (S.tab==="music") renderPanel();
}
function syncBili(force){
  const st=M.state, box=$("#muEmbed"); if(!st || st.kind!=="bilibili") return;
  const want = st.playing ? "on" : "off";
  if (!force && box.dataset.s===want) return; box.dataset.s=want;
  if (!st.playing){ box.innerHTML=`<div class="ph">已暫停</div>`; return; }
  const q=new URLSearchParams(st.src); q.set("autoplay","1"); q.set("high_quality","1"); q.set("danmaku","0"); const t=Math.floor(mPos(st)); if (t>2) q.set("t",t);
  box.innerHTML=`<iframe src="https://player.bilibili.com/player.html?${q}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen scrolling="no"></iframe>`;
}
function tryPlay(fn){ try{ const r=fn(); if (r && r.then) r.then(()=>{ if(M.blocked){ M.blocked=false; renderMusicCtl(); } }).catch(err=>{ if(err && err.name==="NotAllowedError" && !M.blocked){ M.blocked=true; renderMusicCtl(); } }); }catch{} }
function syncNow(){
  const st=M.state; if (!st || M.optOut) return;
  const k=st.kind, p=mCur(), d=mDur();
  const ended = st.playing && !st.loop && d>0 && mPos(st)>=d;
  if (M.el){ const a=M.el;
    if (st.playing && !ended){ if (a.readyState>=1 && Math.abs(a.currentTime-p)>1.5) try{ a.currentTime=p; }catch{} if (a.paused) tryPlay(()=>a.play()); }
    else { if (!a.paused) a.pause(); if (!st.playing && a.readyState>=1 && Math.abs(a.currentTime-p)>1.5) try{ a.currentTime=p; }catch{} }
  }
  if (k==="youtube" && M.ytReady){ const y=M.yt, ps=y.getPlayerState(), list=new URLSearchParams(st.src).get("list");
    if (st.playing && !ended){
      if (!list && Math.abs(y.getCurrentTime()-p)>2) y.seekTo(p,true);
      if (ps!==1 && ps!==3){ y.playVideo(); setTimeout(()=>{ if (M.yt===y && M.state && M.state.playing && ![1,3].includes(y.getPlayerState()) && !M.blocked){ M.blocked=true; renderMusicCtl(); } },2000); } }
    else { if (ps===1||ps===3) y.pauseVideo(); if (!st.playing && !list && Math.abs(y.getCurrentTime()-p)>2) y.seekTo(p,true); }
  }
  if (k==="spotify" && M.sp){ const c=M.sp;
    if (st.playing){ if (M.spPaused){ if (M.spStarted) c.resume(); else { c.play(); M.spStarted=true; } } if (M.spDur && st.src.startsWith("track") && Math.abs(M.spPos-p)>3) c.seek(p); }
    else if (!M.spPaused) c.pause();
  }

}
function applyVol(){ const v=M.muted?0:M.vol/100;
  if (M.el) M.el.volume=v;
  if (M.yt && M.ytReady){ M.yt.setVolume(M.vol); if (M.muted) M.yt.mute(); else M.yt.unMute(); } }
function setVol(v){ M.vol=clamp(Math.round(v),0,100); lsSet("bm-vol",String(M.vol)); if (M.vol>0 && M.muted){ M.muted=false; lsSet("bm-mute",null); } applyVol(); }
function setOptOut(v){ M.optOut=v; lsSet("bm-muoff",v?"1":null); M.key="__"; applyMusic(); if (!v && M.state && M.state.playing) unlockAudio(); toast(v?"已關閉音樂，只影響你這台裝置":"已開啟音樂"); }
function toggleMute(){ M.muted=!M.muted; lsSet("bm-mute",M.muted?"1":null); applyVol(); renderMusic(); }
function unlockAudio(){ const st=M.state; M.blocked=false; if(!st || M.optOut) return;
  if (st.playing){
    if (M.el) tryPlay(()=>M.el.play());
    if (M.yt && M.ytReady) M.yt.playVideo();
    if (M.sp){ M.sp.play(); M.spStarted=true; }
    if (st.kind==="bilibili") syncBili(true);
  }
  setTimeout(syncNow,400); renderMusicCtl(); }
setInterval(()=>{ if (!M.state) return; if (M.state.playing) syncNow();
  if (S.isGM && M.state.all && !M.state.loop && M.state.playing){ const d=mDur(), yl=M.state.kind==="youtube"&&new URLSearchParams(M.state.src).get("list"); if (d>0 && !yl && mPos(M.state)>=d+1.5) mNext(); }
  const t=$("#muTime"); if (t && !M.seeking) t.textContent = fmtT(mCur())+(mDur()?" / "+fmtT(mDur()):"");
  const sk=$("#muSeek"); if (sk && !M.seeking){ sk.max=Math.max(1,Math.floor(mDur())); sk.value=Math.floor(mCur()); } }, 1000);

/* --- 播放器卡片 --- */
function renderMusic(){
  const box=$("#music"), st=M.state;
  box.hidden = !st && !S.isGM;
  box.classList.toggle("min", M.min || !st);
  $("#muFab").classList.toggle("on", !!(st && st.playing && !M.optOut && !M.muted));
  $("#muFab").textContent = (M.optOut||M.muted) && st ? "🔇" : "♪";
  $("#muFab").setAttribute("aria-expanded", String(!!st && !M.min));
  $("#muTitle").textContent = st ? (st.title || guessTitle(st)) : "";
  $("#muKind").textContent = st ? KIND_NAME[st.kind]||"" : "";
  renderMusicCtl();
}
function renderMusicCtl(){
  const st=M.state, el=$("#muCtl"); if (!st){ el.innerHTML=""; return; }
  if (M.optOut){ el.innerHTML=`<p class="hint" style="margin:0">你已關閉音樂，不會下載也不會播放（只影響你這台裝置）。</p><div class="row"><button class="btn primary" data-mu="optin">開啟音樂</button></div>`; return; }
  const seekable = st.kind!=="bilibili" && !(st.kind==="youtube" && new URLSearchParams(st.src).get("list")) && !(st.kind==="spotify" && !st.src.startsWith("track"));
  const tm = fmtT(mCur())+(mDur()?" / "+fmtT(mDur()):"");
  let h="";
  if (M.loading) h+=`<p class="hint" style="margin:0">${esc(M.loading)}</p>`;
  if (M.blocked) h+=`<button class="mu-unlock" data-mu="unlock">🔊 瀏覽器擋住了自動播放，點這裡開始聽</button>`;
  if (st.kind==="bilibili" || st.kind==="spotify") h+=`<p class="hint" style="margin:0">${st.kind==="spotify"?"沒登入 Spotify 只能聽 30 秒試聽。":""}沒聲音的話，按播放器裡的播放鍵。</p>`;
  if (S.isGM){
    h+=`<div class="row"><button class="btn ${st.playing?"":"gm"}" data-mu="toggle" aria-label="${st.playing?"暫停":"播放"}">${st.playing?"❚❚":"▶"}</button><button class="btn" data-mu="restart" aria-label="從頭播放">⏮</button>${(()=>{ const lm=loopMode(st), lab={off:"不循環",one:"單曲循環",all:"清單循環"}[lm]; return `<button class="btn" data-mu="loop" style="${lm!=="off"?"background:var(--ink);color:var(--paper)":""}" aria-label="${lab}（點擊切換）" title="${lab}（點擊切換）">${lm==="one"?"🔂":"🔁"}<span style="font-size:11px;margin-left:3px">${lm==="off"?"關":lm==="one"?"單曲":"清單"}</span></button>`; })()}<button class="btn warn" data-mu="stop" aria-label="停止並清除">⏹</button><span style="flex:1"></span><span id="muTime" class="num">${tm}</span></div>`;

async function musicPanelClick(a, id){
  if (!S.isGM) return;

    else mLoad({...p,title});
    $("#muUrl").value=""; $("#muName").value=""; renderPanel();
  }
  if (a==="muPlayItem"){ const p=M.playlist[id]; if (!p) return; if (M.state && M.state.kind===p.kind && M.state.src===p.src) mSeek(0); else mLoad(p); }
  if (a==="muRenameItem"){ const p=M.playlist[id]; if(!p) return; const r=await dialog({title:"改名", fields:[{id:"t",label:"名稱",value:p.title||"",max:60}]}); if(!r) return;
    p.title=r.t||""; w(ref(`${R}/playlist/${id}/title`).set(p.title));
    if (M.state && M.state.src===p.src){ M.state={...M.state,title:p.title}; w(ref(`${R}/music/title`).set(p.title)); renderMusic(); } renderPanel(); }
  if (a==="muDelItem"){ const p=M.playlist[id]; if(!p) return;
    if (!await confirmBox("從清單刪除",`刪除「${p.title||guessTitle(p)}」？${p.kind==="file"?"上傳的音樂檔也會一起刪除。":""}`,"刪除")) return;
    if (M.state && M.state.kind===p.kind && M.state.src===p.src) mStop();
    delete M.playlist[id]; w(ref(`${R}/playlist/${id}`).remove());
    if (p.kind==="file"){ w(ref(`${R}/audio/${p.src}`).remove()); w(ref(`${R}/audioChunks/${p.src}`).remove()); }

  }

async function uploadAudio(file){
  if (!file || !S.isGM) return;
  if (file.size>AUDIO_MAX){ toast(`檔案 ${(file.size/1048576).toFixed(1)} MB 太大，上限 20 MB`); return; }
  const title=file.name.replace(/\.[a-z0-9]{2,5}$/i,"").slice(0,60);
  if (!S.online){ const key="L"+uid(); M.urls[key]=URL.createObjectURL(file); mLoad({kind:"local", src:key, title}); return; }
  try{
    const buf=new Uint8Array(await file.arrayBuffer()), n=Math.ceil(buf.length/CHUNK), id=uid();
    for (let i=0;i<n;i++){
      const part=buf.subarray(i*CHUNK,(i+1)*CHUNK); let bin=""; for (let j=0;j<part.length;j+=8192) bin+=String.fromCharCode.apply(null, part.subarray(j,j+8192));
      status(`上傳音樂 ${Math.round(i/n*100)}%`); await ref(`${R}/audioChunks/${id}/${i}`).set(btoa(bin));
    }
    await ref(`${R}/audio/${id}`).set({name:file.name.slice(0,120), type:file.type||"audio/mpeg", size:file.size, n, at:Date.now()});
    status(null);
    M.urls[id]=URL.createObjectURL(file);
    const pid=uid(); M.playlist[pid]={kind:"file", src:id, title, size:file.size, at:Date.now()}; w(ref(`${R}/playlist/${pid}`).set(M.playlist[pid]));
    mLoad({kind:"file", src:id, title}); toast("已上傳並開始播放");
  }catch(err){ status(null); onWriteError(err); }
}

/* ============ 認領 ============ */
async function askName(force){
  if (S.myName && !force) return S.myName;
  const r=await dialog({title:"你的名字", text:"讓 GM 和其他玩家知道這是誰。", fields:[{id:"n",label:"名字",value:S.myName,max:16,placeholder:"例如：小明"}], ok:"確定", cancel: force?"取消":null});
  if (!r) return S.myName;
  S.myName=(r.n||"").slice(0,16) || ("玩家"+S.me.slice(-3)); lsSet("bm-name",S.myName);
  if (S.online) ref(`${R}/presence/${S.me}/name`).set(S.myName).catch(()=>{});
  for (const [id,t] of Object.entries(S.tokens)) if (t.ownerId===S.me && t.ownerName!==S.myName) patchToken(id,{ownerName:S.myName});
  return S.myName;
}
async function claim(id){
  const t=S.tokens[id]; if(!t||t.ownerId){ toast("這個棋子已經有人了"); return; }
  if (!S.isGM) await askName(false);
  const r=await dialog({title:`認領「${t.name}」`, text:"設定 4 位數取回碼：之後換手機或換瀏覽器時，用它把棋子拿回來。可以留空，但換裝置就得請 GM 轉交。", fields:[{id:"pin",label:"取回碼（可留空）",type:"text",inputmode:"numeric",max:8,placeholder:"例如 2580"}], ok:"認領"});
  if (!r) return;
  const res=await ref(`${R}/tokens/${id}/ownerId`).transaction(cur=>cur?undefined:S.me).catch(err=>{ onWriteError(err); return null; });
  if (!res || !res.committed){ if(res) toast("剛剛被別人認領了"); return; }
  const pinHash = r.pin ? await hashStr(`${S.room}:pin:${r.pin}`) : null;
  patchToken(id,{ownerId:S.me, ownerName:S.myName||"玩家", pinHash});
  focusToken(id);
  toast(`你現在控制「${t.name}」`, {label:"點錯了", fn:()=>releaseToken(id, true)});
}
function releaseToken(id, quiet){
  const t=S.tokens[id]; if (!t || (t.ownerId!==S.me && !S.isGM)) return;
  patchToken(id,{ownerId:null, ownerName:null, pinHash:null}); if (S.sel===id && !S.isGM) S.sel=null;
  renderPanel(); toast(quiet?"已取消認領":`已放棄「${t.name}」`);
}
async function reclaim(id){
  const t=S.tokens[id]; if (!t) return;
  await askName(false);
  const r=await dialog({title:`取回「${t.name}」`, text:"輸入當初認領時設定的取回碼。", fields:[{id:"pin",label:"取回碼",inputmode:"numeric",max:8}], ok:"取回"});
  if (!r || !r.pin) return;
  const h=await hashStr(`${S.room}:pin:${r.pin}`);
  if (h!==t.pinHash){ toast("取回碼不對，可以請 GM 直接轉交給你"); return; }
  patchToken(id,{ownerId:S.me, ownerName:S.myName||"玩家"}); focusToken(id); toast(`已取回「${t.name}」`);
}

function combatAdd(entries){ const c=S.combat; putCombat({...c, order:[...(c.order||[]), ...entries]}); }
function combatStep(dir){
  const c=S.combat, n=(c.order||[]).length; if(!n) return;
  let turn=c.turn+dir, round=c.round||1;
  if (turn>=n){ turn=0; round++; } if (turn<0){ turn=n-1; round=Math.max(1,round-1); }
  putCombat({...c, turn, round});
}
